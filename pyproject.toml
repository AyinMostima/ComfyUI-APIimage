[project]
name = "comfyui-apiimage"
description = "ComfyUI custom nodes for image generation and editing via Gemini, Grok, OpenAI, ModelArk, Qwen, and GLM APIs"
version = "1.2.0"
license = "MIT"
requires-python = ">= 3.10"
dependencies = [
    "google-genai>=1.0.0",
    "xai_sdk>=1.5.0",
    "dashscope>=1.17.0",
    "Pillow>=9.0.0",
    "requests>=2.28.0",
]

[project.urls]
Repository = "https://github.com/AyinMostima/ComfyUI-APIimage"

[tool.comfy]
PublisherId = "apiimage"
DisplayName = "API Image Generator"
Icon = ""

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["*.test.py", "*.spec.py"]
addopts = ["--import-mode=importlib"]
